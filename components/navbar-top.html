<header class="topbar">
  <span class="topbar-title">Judul Halaman</span>
  <div class="topbar-actions">
    <div class="topbar-search" id="topbar-search-wrap" style="position:relative;">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="topbar-search-input" placeholder="Cari fasilitas, artikel..." autocomplete="off" />
      <div class="search-results-panel" id="topbar-search-results"></div>
    </div>
    <button class="btn-icon" id="topbar-notif-btn" aria-label="Notifikasi" style="position:relative;"><i class="fa-solid fa-bell"></i></button>
    <button class="topbar-avatar-btn" id="topbar-avatar-btn" aria-label="Buka profil"><div class="sidebar-avatar" id="topbar-avatar-initials">HA</div></button>
  </div>
</header>
<header class="mobile-header hide-desktop">
  <span class="mobile-header-title">Judul Halaman</span>
  <div class="mobile-header-actions">
    <button class="btn-icon" id="mobile-notif-btn" aria-label="Notifikasi" style="position:relative;"><i class="fa-solid fa-bell"></i></button>
    <button class="topbar-avatar-btn" id="mobile-avatar-btn" aria-label="Buka profil"><div class="sidebar-avatar" id="mobile-avatar-initials">HA</div></button>
  </div>
</header>
